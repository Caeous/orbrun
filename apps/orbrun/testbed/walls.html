<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbrun wall test bed</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 13px system-ui, sans-serif; }
      #app { display: grid; grid-template-columns: 1fr 360px; grid-template-rows: 1fr; height: 100%; }
      #view { position: relative; min-width: 0; }
      #view canvas { display: block; width: 100%; height: 100%; }
      #side { display: flex; flex-direction: column; gap: 10px; padding: 10px; border-left: 1px solid #333; overflow: auto; }
      #map { width: 340px; height: 340px; background: #000; image-rendering: pixelated; border: 1px solid #333; }
      label { display: flex; align-items: center; gap: 8px; }
      label span.v { min-width: 4.5em; text-align: right; font-variant-numeric: tabular-nums; color: #9cf; }
      input[type=range] { flex: 1; }
      textarea { width: 100%; height: 130px; background: #000; color: #ddd; font: 12px/1.2 ui-monospace, monospace; border: 1px solid #333; }
      .hint { color: #888; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      button { background: #222; color: #ddd; border: 1px solid #444; padding: 3px 8px; }
      button.on { background: #357; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="view"></div>
      <div id="side">
        <div class="row">
          <label>Layout <select id="layout"></select></label>
          <button id="modeOrbit" class="on">Orbit</button>
          <button id="modeWalk">Walk</button>
        </div>
        <label>Inset <input id="inset" type="range" min="0" max="15" step="1" value="12" /><span class="v" id="insetV"></span></label>
        <label><input id="oracle" type="checkbox" checked /> Overlay definition (red where the local rule disagrees)</label>
        <canvas id="map" width="340" height="340"></canvas>
        <textarea id="ascii" spellcheck="false"></textarea>
        <div class="row"><button id="apply">Apply layout</button><span class="hint"># wall, . floor, space void</span></div>
        <div class="hint">Orbit: drag to turn, wheel to zoom. Walk: WASD move, Q/E or drag to turn, R/F height. Click a floor cell on the map to stand there.</div>
        <div class="hint" id="stats"></div>
      </div>
    </div>
    <script type="module" src="./walls.ts"></script>
  </body>
</html>
