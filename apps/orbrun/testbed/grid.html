<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbrun grid test bed</title>
    <style>
      :root {
        --mono: 'DejaVu Sans Mono', Menlo, Consolas, monospace;
        --font: 'Segoe UI', system-ui, sans-serif;
        --cell: 18px;
        --color-0: #000000; --color-1: #3b5bdb; --color-2: #2bb34a; --color-3: #21a1a1;
        --color-4: #d33a3a; --color-5: #b03cb0; --color-6: #b9781f; --color-7: #bfbfbf;
        --color-8: #6e6e6e; --color-9: #7f8fff; --color-10: #7cff7c; --color-11: #7cffff;
        --color-12: #ff7c7c; --color-13: #ff7cff; --color-14: #ffff7c; --color-15: #ffffff;
      }
      html, body { margin: 0; height: 100%; background: #000; color: var(--color-7); overflow: hidden; }
      #screen { position: relative; width: 100%; height: 100%; }
      #grid { position: absolute; left: var(--ox); top: var(--oy); font: var(--cell)/1 var(--mono); white-space: pre; }
      .line { position: relative; height: var(--cell); }
      .fg0 { color: var(--color-0); } .fg1 { color: var(--color-1); } .fg2 { color: var(--color-2); } .fg3 { color: var(--color-3); }
      .fg4 { color: var(--color-4); } .fg5 { color: var(--color-5); } .fg6 { color: var(--color-6); } .fg7 { color: var(--color-7); }
      .fg8 { color: var(--color-8); } .fg9 { color: var(--color-9); } .fg10 { color: var(--color-10); } .fg11 { color: var(--color-11); }
      .fg12 { color: var(--color-12); } .fg13 { color: var(--color-13); } .fg14 { color: var(--color-14); } .fg15 { color: var(--color-15); }
      /* the @ and the button glyphs sit on top of the cell they replace */
      .marker { position: absolute; top: 0; height: var(--cell); background: #000; pointer-events: none; }
      .marker.at { color: var(--color-15); text-shadow: 0 0 6px #fff8; }
      .marker.badge { display: flex; align-items: center; justify-content: center; font-size: calc(var(--cell) * 0.95); }
      .marker.badge svg { display: block; }
      .msg { color: var(--color-7); }
      .msg svg { vertical-align: -0.2em; margin-right: 0.4em; }
      #help { position: absolute; right: 8px; bottom: 6px; font: 11px var(--font); color: #666; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="screen">
      <div id="grid"></div>
      <div id="help"></div>
    </div>
    <script type="module" src="./grid.ts"></script>
  </body>
</html>
